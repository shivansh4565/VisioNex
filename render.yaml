services:
  # VisioNex Unified Production Web Service (FastAPI PyTorch Backend + React SPA Frontend)
  - type: web
    name: visionex-cifar10
    runtime: python
    buildCommand: bash build.sh
    startCommand: python -m uvicorn app.api_server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: NODE_VERSION
        value: 20.x
    autoDeploy: true
    healthCheckPath: /health
